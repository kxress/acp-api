name: acp-api releases

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  node-package:
    name: Build Node package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Verify release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/github_release_assets.ts check-tag
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/node_archive.ts create
      - run: node scripts/node_archive.ts stage
      - uses: actions/upload-artifact@v4
        with:
          name: release-acp-api-node
          path: dist/github-release-assets/*
          if-no-files-found: error
          compression-level: 0

  native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - name: Verify native macOS ARM64 runner
        if: matrix.target == 'macos-arm64'
        run: test "$(uname -m)" = "arm64"
      - name: Verify tag matches source version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/github_release_assets.ts check-tag
      - name: Build, validate, and smoke-test native release bundle
        env:
          ACPAPI_EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
        run: npm run release
      - name: Stage licensed archive, checksum, and manifest
        env:
          ACPAPI_EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/github_release_assets.ts stage
      - uses: actions/upload-artifact@v4
        with:
          name: release-acp-api-${{ matrix.target }}
          path: dist/github-release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [node-package, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release without replacing an existing tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG; refusing to replace its assets."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GH_REPO" --verify-tag --generate-notes \
            --title "acp-api $version"

  verify-public:
    name: Verify public ${{ matrix.target }} package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Download public native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist/public-release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/public-release --pattern "acp-api-${GITHUB_REF_NAME#v}-${{ matrix.target }}*"
      - run: node scripts/verify_public_release.ts dist/public-release ${{ matrix.target }}

  verify-node-package:
    name: Verify public Node package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Download public Node release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/public-release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/public-release --pattern "acp-api-${GITHUB_REF_NAME#v}-node*"
      - run: node scripts/verify_public_release.ts dist/public-release node
